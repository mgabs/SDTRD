repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: check-lgtm-directives
        name: check unresolved lgtm review directives
        entry: sh -c 'if [ -d .lgtm/reviews ]; then directives=$(grep -rn "^#ref " .lgtm/reviews 2>/dev/null || true); if [ -n "$directives" ]; then echo "ERROR: Unresolved LGTM directives in .lgtm/reviews/:" >&2; echo "$directives" >&2; exit 1; fi; fi'
        language: system
        pass_filenames: false

      # Configure project-specific linter and test hooks below
      - id: lint
        name: linter
        entry: make lint
        language: system
        pass_filenames: false

      - id: test
        name: test suite
        entry: make test
        language: system
        pass_filenames: false
